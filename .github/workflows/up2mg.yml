name: Upload XoDos Full MEGA to Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 2.0.0)'
        required: true
        default: '1.0.8'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install megatools
        run: |
          sudo apt update
          sudo apt install -y megatools

      # 🔍 Check if a release for this tag already exists
      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ github.event.inputs.version_tag }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 🏷️ Only create and push the tag for a new release
      - name: Create Git Tag
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "v${{ github.event.inputs.version_tag }}"
          git push origin "v${{ github.event.inputs.version_tag }}"

      # ☁️ Download MEGA files into a clean folder
      - name: Download files from MEGA
        run: |
          mkdir mega-files
          cd mega-files
          megatools dl "https://mega.nz/file/Y4oSyLyC#Hs__8G8ZBUy60o15pNA6WJyXydo1wtVsrnO0J932sbI"

      # 👀 Show downloaded files (corrected path)
      - name: Show downloaded files
        run: ls -lh ../mega-files/

      # 🔐 Generate MD5 and SHA-256 checksums for all downloaded files
      - name: Generate Checksums (MD5 & SHA256)
        id: checksums
        run: |
          cd mega-files
          echo "### 📄 File Checksums" > ../checksums.txt
          echo "" >> ../checksums.txt
          for f in *; do
            if [ -f "$f" ]; then
              md5=$(md5sum "$f" | awk '{print $1}')
              sha256=$(sha256sum "$f" | awk '{print $1}')
              echo "- **$f** → MD5: \`$md5\` • SHA256: \`$sha256\`" >> ../checksums.txt
            fi
          done
          echo "checksum_list<<EOF" >> $GITHUB_ENV
          cat ../checksums.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 🆕 New release → create with body (includes checksums) & all files
      - name: Create new release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ github.event.inputs.version_tag }}"
          name: "XoDos v${{ github.event.inputs.version_tag }}"
          body: |
            🧩 **XoDos v${{ github.event.inputs.version_tag }} lite release**

            ### ✅ What's New
            - Fixed termux x11
            - removed desktop environment
            - removed wine 
            - replaced Debian proot with official termux rootfs native
            - added new Way to install XoDos system from download folder and fall back to APK system if there is nothing found
            - and more

            ### 🧾 Checksums
            ${{ env.checksum_list }}

            ---
            **👥 Credits**  
            XoDos team: @xodiosx 🇾🇪, @KarysDeveloper 🇨🇴, @Mondo67244 🇲🇫, @Aurora0y 🇧🇷, @Chest1902 🇧🇩, @JiaxinChen‑max 🇨🇳, @Snap888 🇷🇺 Mateus (@tokokudo) 🇧🇷 
Logo: @xl_v6 / ashen 🇮🇶

            **💬 Support**  
            Telegram: [t.me/xodemulatorr](https://t.me/xodemulatorr)  
            Discord: [discord.gg/d2ChVhPfnF](https://discord.gg/d2ChVhPfnF)
          files: |
            mega-files/*

      # ♻️ Existing release → only add files, description stays untouched
      - name: Add files to existing release
        if: steps.check_release.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ github.event.inputs.version_tag }}"
          files: |
            mega-files/*